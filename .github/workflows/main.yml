name: Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'cms-admin/**'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20 for Firebase sync
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scripts/package-lock.json'

      - name: Install Firebase sync dependencies
        run: npm --prefix scripts ci

      - name: Sync content and images from Firebase
        run: npm --prefix scripts run sync -- --database portfolio --bucket portfolio-admin-fe051.firebasestorage.app
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup Node.js 14 for Gatsby build
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'

      - name: Install Gatsby dependencies
        run: npm install

      - name: Overwrite tailwind config
        run: cp ./tailwind.config.js ./node_modules/@wkocjan/gatsby-theme-intro/tailwind.config.js

      - name: Build Gatsby site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WEB_GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
